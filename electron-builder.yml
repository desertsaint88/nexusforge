appId: com.nexusforge.app
productName: NexusForge
copyright: Copyright © 2026 NexusForge
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/icon.png
  - resources/icon.ico
  - package.json
  - '!node_modules/7zip-bin/{mac,linux}/**'
# 7za.exe has to live outside the asar archive to be executable.
asarUnpack:
  - node_modules/7zip-bin/**
npmRebuild: false
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
# Assisted installer (pick the folder); updates run it silently from inside the app.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NexusForge
  # The hexagon mark in the Grey Hat look (npm run brand): icons, the welcome/finish side image and the page header.
  # installer.nsh paints every page to match (near-black, light grey, dark buttons and title bar) through
  # electron-builder's page macros. No custom `script`: with one, electron-builder stops building the uninstaller.
  include: resources/installer.nsh
  # English only, like the app (otherwise the buttons follow Windows' language and the texts above stay English).
  multiLanguageInstaller: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/installerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
  runAfterFinish: true
  # Library, mods, profiles and settings in %APPDATA%\NexusForge survive uninstalls and updates.
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
# Releases on GitHub: the installer, its blockmap (differential updates) and latest.yml (version + SHA-512).
publish:
  provider: github
  owner: desertsaint88
  repo: nexusforge
  releaseType: release